name: Release

permissions:
  contents: write
  pull-requests: write
  packages: read
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Git Config
        run: |
          git config user.name "github-action"
          git config user.email "github-action@noreply.github.com"
      - name: Setup PNPM
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - name: Install Dependencies
        run: pnpm i
      - name: Create Release Pull Request or Publish to Qlik GitHub Packages npm registry
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          publish-script: pnpm publish-packages
